config:
  validation: true
  warningsAsErrors: false

style:
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  TrailingWhitespace:
    active: false
  UnusedPrivateMember:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedParameter:
    active: false
  WildcardImport:
    active: false
  DataClassContainsFunctions:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

complexity:
  LongMethod:
    active: false
  LongParameterList:
    active: false
  NestedBlockDepth:
    active: true
    threshold: 5
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  TooManyFunctions:
    active: false
  MethodOverloading:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: false
  PrintStackTrace:
    active: false

comments:
  UndocumentedPublicFunction:
    active: false
  UndocumentedPublicClass:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    active: false
  EmptyClassBlock:
    active: false

naming:
  FunctionMaxLength:
    active: false
  VariableMaxLength:
    active: false
  MatchingDeclarationName:
    active: false
  FunctionNaming:
    active: false
  VariableNaming:
    active: true
